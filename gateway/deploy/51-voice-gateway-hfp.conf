# WirePlumber 0.5.x: this machine is a Bluetooth Hands-Free unit for the phone.
# hfp_hf only: the phone sends call audio here, but no media (A2DP) streams.
# oFono provides HFP call control (dial/answer/hangup) and PipeWire carries the SCO audio.
monitor.bluez.properties = {
  bluez5.roles = [ hfp_hf ]
  bluez5.hfphsp-backend = "ofono"
}
