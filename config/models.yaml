# Model candidates for Phase 4 benchmarking on a Colab T4 (16 GB, sm_75).
# Every repo/file below was verified to exist on Hugging Face on 2026-11-07.
# `license` is what the publisher states; check before commercial use.
# Paths are relative to $VOICE_AGENT_ROOT/models.

stt:
  # faster-whisper (CTranslate2) conversions of OpenAI Whisper. All MIT.
  - id: whisper-small
    repo: Systran/faster-whisper-small
    dir: stt/faster-whisper-small
    license: MIT
  - id: whisper-medium
    repo: Systran/faster-whisper-medium
    dir: stt/faster-whisper-medium
    license: MIT
  - id: whisper-large-v3-turbo
    repo: mobiuslabsgmbh/faster-whisper-large-v3-turbo
    dir: stt/faster-whisper-large-v3-turbo
    license: MIT
  - id: whisper-large-v3
    repo: Systran/faster-whisper-large-v3
    dir: stt/faster-whisper-large-v3
    license: MIT
    optional: true          # slowest; benchmark only if turbo's Urdu accuracy is insufficient

llm:
  # GGUF Q4_K_M served by llama.cpp llama-server.
  - id: qwen2.5-3b
    repo: Qwen/Qwen2.5-3B-Instruct-GGUF
    file: qwen2.5-3b-instruct-q4_k_m.gguf
    license: "Qwen Research License - NON-COMMERCIAL. Benchmark baseline only."
  - id: qwen2.5-7b
    repo: bartowski/Qwen2.5-7B-Instruct-GGUF
    file: Qwen2.5-7B-Instruct-Q4_K_M.gguf
    license: Apache-2.0
  - id: qwen3-4b
    repo: Qwen/Qwen3-4B-GGUF
    file: Qwen3-4B-Q4_K_M.gguf
    license: Apache-2.0
    chat_template_kwargs: {enable_thinking: false}
  - id: qwen3-8b
    repo: bartowski/Qwen_Qwen3-8B-GGUF
    file: Qwen_Qwen3-8B-Q4_K_M.gguf
    license: Apache-2.0
    chat_template_kwargs: {enable_thinking: false}
  - id: gemma3-4b
    repo: bartowski/google_gemma-3-4b-it-GGUF
    file: google_gemma-3-4b-it-Q4_K_M.gguf
    license: "Gemma Terms of Use (commercial use permitted under Google's terms)"

tts:
  - id: kokoro
    repo: hexgrad/Kokoro-82M
    languages: [en]
    license: Apache-2.0
    note: "pip package `kokoro` requires Python < 3.13"
  - id: mms-urd
    repo: facebook/mms-tts-urd-script_arabic
    dir: tts/mms-tts-urd-script_arabic
    languages: [ur]
    license: "CC-BY-NC-4.0 - NON-COMMERCIAL. Evaluation baseline only."
  - id: mms-eng
    repo: facebook/mms-tts-eng
    dir: tts/mms-tts-eng
    languages: [en]
    license: "CC-BY-NC-4.0 - non-commercial (fine for this personal project)"
    note: "English fallback when kokoro cannot install (Colab runs Python 3.13)"
  - id: azure
    languages: [ur, en]
    license: "Paid API. Optional quality reference; skipped without AZURE_SPEECH_KEY."
  # Not implemented yet (next evaluation round, see docs/phase3-4-ai-pipeline.md):
  #   multilingual-tts/VITS-OpenBible-Urdu  (CC-BY-SA-4.0, coqui-tts)
  #   mahwizzzz/orpheus-urdu-tts            (MIT finetune of Orpheus 3B; base model license applies)
  #   multilingual-tts/F5-TTS-OpenBible-Urdu (CC-BY-SA-4.0)

vad:
  - id: silero
    package: silero-vad
    license: MIT
