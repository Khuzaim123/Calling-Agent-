[project]
name = "voice-agent"
version = "0.1.0"
description = "Real-time voice engine for a multi-tenant AI phone agent (business logic lives in n8n)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "gpu: needs CUDA + downloaded models (run in Colab)",
]
